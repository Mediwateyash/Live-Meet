<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="smitShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4C1D95" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Shield Body -->
  <path d="M32 4 L54 12 V32 C54 44 44 55 32 60 C20 55 10 44 10 32 V12 Z" fill="url(#smitShield)" filter="url(#glow)"/>
  
  <!-- Inner Shield Border -->
  <path d="M32 8 L50 15 V31 C50 41 42 50 32 55 C22 50 14 41 14 31 V15 Z" fill="none" stroke="url(#goldAccent)" stroke-width="1.5" stroke-opacity="0.85"/>

  <!-- Graduation Cap Top -->
  <polygon points="32,18 45,24 32,30 19,24" fill="#FFFFFF"/>
  <polygon points="32,20 42,24.5 32,29 22,24.5" fill="url(#goldAccent)"/>

  <!-- Cap Skull Base -->
  <path d="M23 27 V32 C23 35.5 27 37 32 37 C37 37 41 35.5 41 32 V27" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Tassel -->
  <path d="M43 24.5 V33" stroke="url(#goldAccent)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="43" cy="34" r="1.5" fill="#FDE047"/>

  <!-- SMIT Text -->
  <text x="32" y="47" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="900" font-size="9" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SMIT</text>
</svg>